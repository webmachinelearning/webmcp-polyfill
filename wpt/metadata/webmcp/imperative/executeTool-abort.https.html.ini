# The first case expects a raw string result. The second expects toolactivated
# after the callback starts; the draft dispatches it before invoking the callback.
# The third aborts synchronously after executeTool(); the polyfill rejects before
# dispatching to the callback (see TESTING.md "Timing"), so the callback never
# resolves the promise the test awaits. The last case does not run.
[executeTool-abort.https.html]
  expected: TIMEOUT
  [executeTool() provides a non-aborted default AbortSignal when called without options]
    expected: FAIL
  [caller abort propagates to tool callback options.signal]
    expected: FAIL
  [executeTool() promise remains rejected even if tool callback resolves after abort]
    expected: TIMEOUT
  [concurrent executions of the same tool have independent AbortSignals]
    expected: NOTRUN
