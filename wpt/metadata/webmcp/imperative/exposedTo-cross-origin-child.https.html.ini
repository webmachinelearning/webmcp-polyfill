# The first two cases expect raw string results, which the draft JSON-serializes. The first
# and third cases fail before their controller.abort(), so their parent tools stay registered:
# the iframe still sees the one exposed to it, and the parent sees both of its own tools.
[exposedTo-cross-origin-child.https.html]
  [Parent exposes tool to cross-origin child]
    expected: FAIL
  [Cross-origin child exposes tool to parent]
    expected: FAIL
  [Parent exposes tool to origin that is neither its own nor its iframe's]
    expected: FAIL
  [Iframe exposes tool to origin that is neither its own nor its parent's]
    expected: FAIL
